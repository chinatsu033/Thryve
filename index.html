<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Thryve — 个人情绪、睡眠与就医总结工具" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Thryve" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2c2c2c" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <title>Thryve</title>
    <script>
      (function () {
        try {
          var redirect = sessionStorage.getItem('ghpages-redirect')
          if (redirect) {
            sessionStorage.removeItem('ghpages-redirect')
            if (redirect !== location.href) {
              history.replaceState(null, '', redirect)
            }
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
